# Deploy API + Web to Azure App Service on every push to main.
# One-time setup: add GitHub Actions secrets
#   AZURE_WEBAPP_PUBLISH_PROFILE_API
#   AZURE_WEBAPP_PUBLISH_PROFILE_WEB
# (Download publish profiles from each App Service in Azure Portal.)

name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_API_URL: https://relationship-sourcing-api-dagshxhjachtgrfn.canadacentral-01.azurewebsites.net
  API_APP_NAME: relationship-sourcing-api
  WEB_APP_NAME: relationship-sourcing-web

jobs:
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package backend
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/api-stage"
          mkdir -p "$STAGE"
          rsync -a backend/ "$STAGE/" \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude 'data/*.db' \
            --exclude 'data/*.db-*'
          mkdir -p "$STAGE/data"
          (cd "$STAGE" && zip -rq "${RUNNER_TEMP}/relationship-sourcing-api.zip" .)

      - name: Deploy to Azure Web App (API)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
          package: ${{ runner.temp }}/relationship-sourcing-api.zip

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ env.AZURE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Package web host + dist
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/web-stage"
          mkdir -p "$STAGE/dist"
          cp -R frontend/dist/* "$STAGE/dist/"
          cp deploy/web-host/package.json "$STAGE/"
          cp deploy/web-host/server.js "$STAGE/"
          (cd "$STAGE" && zip -rq "${RUNNER_TEMP}/relationship-sourcing-web.zip" .)

      - name: Deploy to Azure Web App (Web)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEB_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_WEB }}
          package: ${{ runner.temp }}/relationship-sourcing-web.zip
